name: Deploy Firestore & Storage rules

# The app itself is deployed by Firebase App Hosting (automatic rollouts on the
# staging and main branches). Database and storage rules are not, so this
# workflow ships them to the matching project when they change.
on:
  push:
    branches: [staging, main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - storage.rules
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy the rules
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  id-token: write # keyless sign-in to Google Cloud (Workload Identity Federation)

concurrency:
  group: rules-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub Environments hold each project's settings; "production" can require approval.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Deploy rules and indexes
        run: >
          npx --yes firebase-tools@15.34.0 deploy
          --only firestore,storage
          --project "${{ vars.FIREBASE_PROJECT_ID }}"
          --non-interactive
