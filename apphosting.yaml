# Settings for Cloud Run backend in Firebase App Hosting
runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # Signs admin session cookies. Create it once before deploying:
  #   firebase apphosting:secrets:set ADMIN_SESSION_SECRET
  - variable: ADMIN_SESSION_SECRET
    secret: ADMIN_SESSION_SECRET
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: the-cx-assembly
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: the-cx-assembly.firebaseapp.com
  # Public address used for canonical links, the sitemap and social previews.
  # Change it to the custom domain (e.g. https://thecxassembly.com) once that
  # domain is connected to App Hosting.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://cx-assembly--the-cx-assembly.us-east4.hosted.app
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: the-cx-assembly.firebasestorage.app
