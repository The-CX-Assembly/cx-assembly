# Settings for Cloud Run backend in Firebase App Hosting
runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: the-cx-assembly
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: the-cx-assembly.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: the-cx-assembly.appspot.com
