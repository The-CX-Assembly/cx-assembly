# Firebase App Hosting settings: PRODUCTION (project the-cx-assembly, live branch main).
# The staging backend layers apphosting.staging.yaml on top of this file.
runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_APP_ENV
    value: production

  # Signs admin session cookies. Lives in this project's Secret Manager:
  #   firebase apphosting:secrets:set ADMIN_SESSION_SECRET --project the-cx-assembly
  - variable: ADMIN_SESSION_SECRET
    secret: ADMIN_SESSION_SECRET

  # Public address used for canonical links, the sitemap and social previews.
  # Change it to the custom domain (e.g. https://thecxassembly.com) once that
  # domain is connected to App Hosting.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://cx-assembly--the-cx-assembly.us-east4.hosted.app

  # Firebase web app "CX Assembly Web" (public values, safe in the browser).
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: the-cx-assembly
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:495318982977:web:841372ff381894195d81c0
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDBeGegBBI4g1h_xd-TZ2EwXFeQn07ERss
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: the-cx-assembly.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "495318982977"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: the-cx-assembly.firebasestorage.app

  # Optional, uncomment to enable:
  # Google Tag Manager container for the public site (never loads in /admin or on staging).
  # - variable: NEXT_PUBLIC_GTM_ID
  #   value: GTM-XXXXXXX
  # Google Search Console "HTML tag" verification code (content="…" part only).
  # - variable: NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
  #   value: your-verification-code
